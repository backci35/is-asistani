<style>

.m{color:var(--mut);font-size:13px;margin-top:4px;display:flex;flex-wrap:wrap;gap:3px 10px}

textarea{min-height:130px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}

.sheet.on{display:flex}

u.is,u.kisisel,u.dn{width:6px;height:6px;border-radius:50%;display:inline-block;text-decoration:none}
u.is{background:var(--d)}u.kisisel{background:#b69cff}u.dn{background:#566074}
.lg{display:flex;gap:14px;color:var(--mut);font-size:12.5px;margin-top:10px}
.card .body[data-a=edit]{cursor:pointer}
.nt{color:var(--mut);font-size:13px;margin-top:5px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ver{text-align:center;color:var(--mut);font-size:12px;margin:18px 0 0}
